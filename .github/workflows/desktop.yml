name: Desktop build and packages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  desktop:
    name: ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: macos-15
            runtime: osx-arm64
          - os: macos-15-intel
            runtime: osx-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore and build
        run: |
          dotnet restore SoundPreviewer.sln --configfile NuGet.Config
          dotnet build SoundPreviewer.sln -c Release --no-restore
      - name: Verify library and workers
        run: dotnet run --project tests/SoundPreviewer.Tests -c Release --no-build
      - name: Install state conversion test dependencies
        run: python -m pip install serum2-preset-loader==0.1.3 cbor2==5.6.5 zstandard==0.23.0
      - name: Verify optional renderer protocol
        run: python -m unittest discover -s scripts/renderers -p "test_*.py"
      - name: Publish Windows application and x86 host
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Publish-Desktop.ps1
      - name: Verify bundled x86 host without loading plugins
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./src/SoundPreviewer.Vst2Host/verify-self-test.ps1 -HostPath artifacts/publish-win-x64/Vst2Host-x86/SoundPreviewer.Vst2Host.exe
      - name: Publish macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/Publish-Desktop.sh "${{ matrix.runtime }}"
      - name: Verify published desktop UI with isolated empty user data
        shell: pwsh
        run: ./scripts/Test-DesktopPackage.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Prepare Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Package Windows installer and portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Package-Desktop.ps1
      - name: Package macOS app, ZIP and disk image
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/Package-Desktop.sh "${{ matrix.runtime }}"
      - name: Verify packaged macOS app
        if: runner.os == 'macOS'
        shell: pwsh
        run: ./scripts/Test-DesktopPackage.ps1 -Runtime '${{ matrix.runtime }}' -ApplicationPath 'artifacts/package-${{ matrix.runtime }}/SoundPreviewer.app/Contents/MacOS/SoundPreviewer'
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.runtime }}
          path: artifacts/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-diagnostics-${{ matrix.runtime }}
          path: artifacts/ui-smoke-*/
          if-no-files-found: ignore
          retention-days: 7
