name: Release desktop

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release version and tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          version = ET.parse('Version.props').findtext('./PropertyGroup/Version')
          if not version or not re.fullmatch(r'\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Version.props must contain a semantic version.')
          if os.environ['RELEASE_REF_TYPE'] == 'tag' and os.environ['RELEASE_REF_NAME'] != f'v{version}':
              raise SystemExit('The release tag must match Version.props exactly.')
          print(f'Validated v{version}; manual runs build packages without publishing a release.')
          PY
  packages:
    needs: version
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: read
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Verify checksums and required packages
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for runtime in win-x64 osx-arm64 osx-x64; do
            test -f "SHA256SUMS-$runtime.txt"
            sha256sum --check "SHA256SUMS-$runtime.txt"
          done
          test -f "SoundPreviewer-$version-win-x64-setup.exe"
          test -f "SoundPreviewer-$version-win-x64-portable.zip"
          for runtime in osx-arm64 osx-x64; do
            test -f "SoundPreviewer-$version-$runtime.zip"
            test -f "SoundPreviewer-$version-$runtime.dmg"
          done
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          if existing_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            [[ "$existing_draft" == true ]] || { echo 'Refusing to replace an already published release.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "SoundPreviewer $RELEASE_TAG" --generate-notes "${options[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${options[@]}"
