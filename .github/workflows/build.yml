name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Restore offline projects
        run: dotnet restore SoundPreviewer.sln --configfile NuGet.Config
      - name: Build
        run: dotnet build SoundPreviewer.sln -c Release --no-restore
      - name: Verify library and workers
        run: ./tests/SoundPreviewer.Tests/bin/Release/net8.0-windows/SoundPreviewer.Tests.exe
      - name: Publish desktop application
        run: dotnet publish src/SoundPreviewer.App/SoundPreviewer.App.csproj -c Release --no-restore -o artifacts/publish
      - uses: actions/upload-artifact@v4
        with:
          name: SoundPreviewer-windows
          path: artifacts/publish/
